{% extends "base.html" %}
{% if sensor %}
    {% set page_title = "Редактирование датчика" %}
{% else %}
    {% set page_title = "Добавление датчика" %}
{% endif %}
{% block title %}{{ page_title }}{% endblock %}
{% block content %}
<div class="card">
    <div class="card-header">
        <div class="card-title">{{ page_title }}</div>
        <div>
            <a href="{{ url_for('sensors_list') }}" class="btn btn-secondary">Назад</a>
        </div>
    </div>
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="field">
            <label for="name">Наименование *</label>
            <input type="text" id="name" name="name" required value="{{ (sensor.name if sensor) or '' }}">
        </div>
        <div class="field">
            <label for="serial_number">Серийный номер *</label>
            <input type="text" id="serial_number" name="serial_number" required value="{{ (sensor.serial_number if sensor) or '' }}">
        </div>
        <div class="field">
            <label for="sensor_type">Тип датчика *</label>
            <input type="text" id="sensor_type" name="sensor_type" required value="{{ (sensor.sensor_type if sensor) or '' }}">
        </div>
        <div class="field">
            <label for="status_id">Статус *</label>
            <select id="status_id" name="status_id" required>
                {% for st in statuses %}
                    <option value="{{ st.id }}" {% if sensor and sensor.status_id == st.id %}selected{% endif %}>
                        {{ st.name }}
                    </option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{{ url_for('sensors_list') }}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
