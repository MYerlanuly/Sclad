<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — {{ sclad_name }}</title>
    <script src="{{ url_for('static', filename='js/tailwind.min.js') }}"></script>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-white rounded-2xl shadow-lg border border-slate-200 p-8">
        <div class="flex justify-center mb-4">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Богатырь" class="h-14 w-auto object-contain object-center" />
        </div>
        <h1 class="text-xl font-semibold text-slate-800 text-center mb-1">{{ sclad_name }}</h1>
        <p class="text-sm text-slate-500 text-center mb-6">Войдите в систему</p>
        {% if error %}
            <div class="mb-4 px-3 py-2 rounded-lg bg-red-50 text-red-700 text-sm border border-red-200">{{ error }}</div>
        {% endif %}
        <form method="post" action="{{ url_for('login') }}" autocomplete="on">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
            <div class="mb-4">
                <label for="username" class="block text-sm font-medium text-slate-700 mb-1">Логин</label>
                <input type="text" id="username" name="username" required autofocus
                    autocomplete="username"
                    class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    value="{{ request.form.username or '' }}" placeholder="Логин">
            </div>
            <div class="mb-4">
                <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Пароль</label>
                <input type="password" id="password" name="password" required
                    autocomplete="current-password"
                    class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="Пароль">
            </div>
            <div class="mb-5">
                <label class="inline-flex items-center gap-2 text-sm text-slate-600">
                    <input type="checkbox" name="remember" value="1" class="rounded border-slate-300">
                    Запомнить меня
                </label>
            </div>
            <button type="submit" class="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition-colors">Войти</button>
        </form>
    </div>
</body>
</html>
