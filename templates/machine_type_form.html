{% extends "base.html" %}
{% if machine_type %}
    {% set page_title = "Редактирование типа техники" %}
{% else %}
    {% set page_title = "Добавление типа техники" %}
{% endif %}
{% block title %}{{ page_title }}{% endblock %}
{% block content %}
<div class="card">
    <div class="card-header">
        <div class="card-title">{{ page_title }}</div>
        <div>
            <a href="{{ url_for('machine_types_list') }}" class="btn btn-secondary">Назад</a>
        </div>
    </div>
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="field">
            <label for="name">Название типа *</label>
            <input type="text" id="name" name="name" required value="{{ (machine_type.name if machine_type) or '' }}">
        </div>
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{{ url_for('machine_types_list') }}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
