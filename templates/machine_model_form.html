{% extends "base.html" %}
{% if model %}
    {% set page_title = "Редактирование модели техники" %}
{% else %}
    {% set page_title = "Добавление модели техники" %}
{% endif %}
{% block title %}{{ page_title }}{% endblock %}
{% block content %}
<div class="card">
    <div class="card-header">
        <div class="card-title">{{ page_title }}</div>
        <div>
            <a href="{{ url_for('machine_models_list') }}" class="btn btn-secondary">Назад</a>
        </div>
    </div>
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="field">
            <label for="name">Название модели *</label>
            <input type="text" id="name" name="name" required value="{{ (model.name if model) or '' }}">
        </div>
        <div class="field">
            <label for="machine_type_id">Тип техники *</label>
            <select id="machine_type_id" name="machine_type_id" required>
                {% for t in types %}
                    <option value="{{ t.id }}" {% if model and model.machine_type_id == t.id %}selected{% endif %}>
                        {{ t.name }}
                    </option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{{ url_for('machine_models_list') }}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
